name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  behat:
    runs-on: ubuntu-latest
    environment: Testing
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Clear Configuration Cache
        run: php artisan config:clear --ansi

      # Modo NO estricto (default de Behat): los pasos pending (scaffolds) y
      # undefined (features aun sin context) se reportan pero NO rompen CI; solo
      # los fallos reales lo hacen. Asi las features a medio implementar se van
      # exigiendo solas conforme pasan. NO agregar --strict.
      #
      # La suite es 100% volatil: todos los modulos usan repositorios InMemory en
      # Behat, por eso no se provisiona Postgres ni variables de conexion.
      - name: Run Behat
        run: vendor/bin/behat --profile=default --no-interaction
