name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  behat:
    runs-on: ubuntu-latest
    environment: Testing
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Clear Configuration Cache
        run: php artisan config:clear --ansi

      # Solo corren en CI las features marcadas con @listo (opt-in): features
      # terminadas y 100% verdes. Las features a medio implementar (pasos
      # pending/undefined o escenarios en rojo) quedan fuera del filtro y no
      # rompen el pipeline. Cuando una feature se completa se le agrega el tag
      # @listo encima de "Característica:" y entra automaticamente a CI.
      #
      # Como el set @listo es curado, se corre en --strict: una feature marcada
      # como lista DEBE estar totalmente verde (sin pending ni undefined).
      #
      # La suite es 100% volatil: todos los modulos usan repositorios InMemory en
      # Behat, por eso no se provisiona Postgres ni variables de conexion.
      - name: Run Behat
        run: vendor/bin/behat --profile=default --no-interaction --tags=@listo --strict

  arch:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # Hace cumplir la Regla de Oro y la pureza del Domain (tests/Arch).
      # Suite puramente estatica: no toca base de datos.
      - name: Run Architecture Tests
        run: vendor/bin/pest --testsuite=Arch
