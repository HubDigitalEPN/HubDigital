name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      # Aviso real, no bloqueo: lint:check (--test) detecta archivos sin formatear
      # y devuelve !=0; el "|| echo ::warning::" lo convierte en una anotacion ⚠️
      # visible en el resumen del run y deja el paso en verde (no rompe el job).
      - name: Check formatting (warn only)
        run: composer lint:check || echo "::warning title=Pint::Hay archivos sin formatear. Corré 'composer lint' localmente."

      # Idem: los CVE suelen estar en deps transitivas y se resuelven con bumps.
      - name: Audit Dependencies (CVEs, warn only)
        run: composer audit || echo "::warning title=composer audit::Hay advisories de seguridad en dependencias."

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
