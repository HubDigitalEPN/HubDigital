name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      # Modo --test: detecta archivos sin formatear y devuelve !=0 (a diferencia
      # de "composer lint", que arregla y siempre sale 0). continue-on-error lo
      # deja como aviso (paso con ⚠️) sin romper el pipeline.
      - name: Check formatting (warn only)
        run: composer lint:check
        continue-on-error: true

      # Aviso, no bloqueo: los CVE casi siempre estan en deps transitivas y se
      # resuelven con bumps. Marca el paso con ⚠️ sin tumbar el job.
      - name: Audit Dependencies (CVEs, warn only)
        run: composer audit
        continue-on-error: true

