gzip             on;
gzip_comp_level  5;
gzip_min_length  256;
gzip_proxied     any;
gzip_vary        on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root  /var/www/html/public;
    index index.php;

    charset utf-8;

    client_max_body_size 50m;

    add_header X-Frame-Options     "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"  always;

    # User-uploaded files served directly from the bind-mounted storage volume.
    # Avoids routing file downloads through PHP-FPM and bypasses the
    # public/storage symlink (which doesn't exist in the nginx image).
    location ^~ /storage/ {
        alias /var/www/html/public/storage/;
        access_log off;
        expires    30d;
        add_header Cache-Control "public";
    }

    # Vite-built assets have content-hashed filenames — cache aggressively
    location ~* ^/build/ {
        expires    1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM delegation
    location ~ \.php$ {
        fastcgi_pass            app:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include                 fastcgi_params;
        fastcgi_hide_header     X-Powered-By;
        fastcgi_read_timeout    120s;
        fastcgi_buffers         8 16k;
        fastcgi_buffer_size     32k;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Block hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log combined;
}
