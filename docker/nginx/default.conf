gzip             on;
gzip_comp_level  5;
gzip_min_length  256;
gzip_proxied     any;
gzip_vary        on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root  /var/www/html/public;
    index index.php;

    charset utf-8;

    client_max_body_size 50m;

    add_header X-Frame-Options     "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"  always;

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
        access_log off;
    }

    # Los documentos se sirven con autorización desde R2, igual que en OCI.
    location ^~ /storage/ {
        return 404;
    }

    # Vite-built assets have content-hashed filenames — cache aggressively
    location ~* ^/build/ {
        expires    1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM delegation
    location ~ \.php$ {
        # Docker puede cambiar la IP de `app` al recrear el contenedor. Resolver
        # el nombre en tiempo de ejecucion evita conservar una IP obsoleta y
        # devolver 502 hasta reiniciar Nginx.
        resolver                127.0.0.11 valid=10s ipv6=off;
        set                     $php_fpm_backend app:9000;
        fastcgi_pass            $php_fpm_backend;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include                 fastcgi_params;
        fastcgi_hide_header     X-Powered-By;
        fastcgi_read_timeout    120s;
        fastcgi_buffers         8 16k;
        fastcgi_buffer_size     32k;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Block hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log combined;
}
