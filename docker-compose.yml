services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: ./.env
    volumes:
      - ./storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    expose:
      - "9000"
    networks:
      - internal

  worker:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: ./.env
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: ./.env
    command: php artisan schedule:work
    volumes:
      - ./storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  nginx:
    build:
      context: .
      target: nginx-stage
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./storage/app/public:/var/www/html/public/storage:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  laravel_cache:

networks:
  internal:
    driver: bridge
