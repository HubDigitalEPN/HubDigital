server {
    # Configuracion transitoria y valida antes de emitir el certificado ACME.
    listen 80;
    listen [::]:80;
    server_name dev.labinvepn.org;
    server_tokens off;

    root /srv/hubdigital/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 50m;
    client_body_timeout 120s;
    client_body_temp_path /run/hubdigital/nginx-client 1 2;
    fastcgi_temp_path /run/hubdigital/nginx-fastcgi 1 2;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location ^~ /storage/ { return 404; }
    location ~ /\. { deny all; access_log off; log_not_found off; }

    location ~* ^/build/ {
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css application/javascript application/json image/svg+xml;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Misma política del origen HTTPS para los recursos públicos del portal.
    location ~* ^/(?:css|js|images)/.*\.(?:css|js|svg)$ {
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css application/javascript image/svg+xml;
        expires 1h;
        try_files $uri =404;
    }

    location = /service-worker.js {
        expires -1;
        try_files $uri =404;
    }

    location = /pwa-cache.js {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS off;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO http;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 240s;
        fastcgi_pass unix:/run/php/hubdigital.sock;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
}
