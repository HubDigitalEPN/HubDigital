server {
    # Origen directo: HTTP solo existe para el desafio ACME y redireccion HTTPS.
    listen 80;
    listen [::]:80;
    server_name dev.labinvepn.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.labinvepn.org;
    server_tokens off;

    # Certbot instala las rutas del certificado valido para este subdominio.
    ssl_certificate /etc/letsencrypt/live/dev.labinvepn.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.labinvepn.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/hubdigital/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 50m;
    client_body_timeout 120s;
    client_body_temp_path /run/hubdigital/nginx-client 1 2;
    fastcgi_temp_path /run/hubdigital/nginx-fastcgi 1 2;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # No publicar el antiguo disco public/storage: los documentos se sirven
    # autenticados desde R2 mediante controladores Laravel.
    location ^~ /storage/ { return 404; }
    location ~ /\. { deny all; access_log off; log_not_found off; }

    location ~* ^/build/ {
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css application/javascript application/json image/svg+xml;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Solo archivos públicos; no comprimir documentos de sesión ni respuestas R2.
    location ~* ^/(?:css|js|images)/.*\.(?:css|js|svg)$ {
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css application/javascript image/svg+xml;
        expires 1h;
        try_files $uri =404;
    }

    location = /service-worker.js {
        expires -1;
        try_files $uri =404;
    }

    location = /pwa-cache.js {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Nginx es el limite de confianza. No se aceptan cabeceras reenviadas
        # suministradas por clientes directos; el origen siempre termina TLS.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 240s;
        fastcgi_pass unix:/run/php/hubdigital.sock;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
}
